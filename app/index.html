<!DOCTYPE html>
<html>
<head>
  <base href="/portfolio/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="최인호의 개발 포트폴리오">
  <meta name="theme-color" content="#050505">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Portfolio - 최인호</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* 🎨 전역 스타일 — Ethereal Glass (앱 본체와 동일한 다크 톤) */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      overflow: hidden;
      background: #050505;
    }

    /* 🌌 로딩 컨테이너 */
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      background: #050505;
      transition: opacity 0.6s ease-out;
    }

    #loading-container.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* 🌠 떠다니는 메시 그라디언트 블롭 (앱 배경과 동일한 연출) */
    .mesh-background {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 1;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(10px);
    }

    .orb-purple {
      top: -18%;
      left: -12%;
      width: 46vmax;
      height: 46vmax;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.32) 0%, rgba(168, 85, 247, 0) 70%);
      animation: drift-a 14s ease-in-out infinite;
    }

    .orb-blue {
      top: 8%;
      right: -18%;
      width: 50vmax;
      height: 50vmax;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.3) 0%, rgba(59, 130, 246, 0) 70%);
      animation: drift-b 17s ease-in-out infinite;
    }

    .orb-emerald {
      bottom: -22%;
      left: 8%;
      width: 48vmax;
      height: 48vmax;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.3) 0%, rgba(16, 185, 129, 0) 70%);
      animation: drift-c 15s ease-in-out infinite;
    }

    @keyframes drift-a {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(4vmax, 5vmax) scale(1.12); }
    }

    @keyframes drift-b {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(-5vmax, 4vmax) scale(1.08); }
    }

    @keyframes drift-c {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(3vmax, -4.5vmax) scale(1.15); }
    }

    /* 💬 타이핑 텍스트 컨테이너 */
    .typing-container {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 0 20px;
    }

    .eyebrow {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(16, 185, 129, 0.3);
      background: rgba(16, 185, 129, 0.1);
      color: #10B981;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.3em;
      opacity: 0;
      animation: fade-in 0.6s ease-out 0.2s forwards;
    }

    .typing-text {
      margin-top: 1.5rem;
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #f5f5f7;
      min-height: 3rem;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      text-shadow: 0 0 30px rgba(16, 185, 129, 0.35), 0 0 60px rgba(59, 130, 246, 0.2);
      animation: fade-in 0.6s ease-out 0.5s forwards;
    }

    .cursor {
      display: inline-block;
      width: 3px;
      height: 2.5rem;
      background-color: #10B981;
      margin-left: 5px;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.8);
      animation: blink 1s infinite;
    }

    @keyframes fade-in {
      to {
        opacity: 1;
      }
    }

    @keyframes blink {
      0%, 49% {
        opacity: 1;
      }
      50%, 100% {
        opacity: 0;
      }
    }

    /* 🎯 로딩 인디케이터 */
    .loading-dots {
      position: relative;
      z-index: 2;
      display: flex;
      gap: 10px;
      margin-top: 2.5rem;
      opacity: 0;
      animation: fade-in 0.6s ease-out 0.9s forwards;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, #10B981, #3B82F6);
      box-shadow: 0 0 14px rgba(16, 185, 129, 0.6);
      animation: bounce 1.4s infinite ease-in-out;
    }

    .dot:nth-child(2) {
      animation-delay: -0.16s;
      background: linear-gradient(135deg, #3B82F6, #A855F7);
      box-shadow: 0 0 14px rgba(59, 130, 246, 0.6);
    }

    .dot:nth-child(3) {
      animation-delay: -0.32s;
      background: linear-gradient(135deg, #A855F7, #10B981);
      box-shadow: 0 0 14px rgba(168, 85, 247, 0.6);
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: scale(0.7);
        opacity: 0.5;
      }
      40% {
        transform: scale(1.3);
        opacity: 1;
      }
    }

    /* 📱 반응형 */
    @media (max-width: 768px) {
      .typing-text {
        font-size: 1.8rem;
      }

      .cursor {
        height: 1.8rem;
      }
    }

    @media (max-width: 480px) {
      .typing-text {
        font-size: 1.4rem;
      }

      .cursor {
        height: 1.4rem;
      }
    }
  </style>
</head>
<body>
<!-- 🌌 로딩 화면 -->
<div id="loading-container">
  <!-- 떠다니는 메시 그라디언트 배경 -->
  <div class="mesh-background">
    <div class="orb orb-purple"></div>
    <div class="orb orb-blue"></div>
    <div class="orb orb-emerald"></div>
  </div>

  <!-- 타이핑 텍스트 -->
  <div class="typing-container">
    <span class="eyebrow">PORTFOLIO</span>
    <div class="typing-text">
      <span id="typed-text"></span>
      <span class="cursor"></span>
    </div>
  </div>

  <!-- 로딩 인디케이터 -->
  <div class="loading-dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>

<!-- 📜 타이핑 스크립트 -->
<script>
  // 타이핑 효과 텍스트
  const texts = [
    "안녕하세요",
    "개발자 최인호입니다",
    "포트폴리오를 준비중입니다..."
  ];

  let textIndex = 0;
  let charIndex = 0;
  let isDeleting = false;
  let typingSpeed = 100;

  function typeText() {
    const currentText = texts[textIndex];
    const typedTextElement = document.getElementById('typed-text');

    if (!isDeleting) {
      // 타이핑 중
      typedTextElement.textContent = currentText.substring(0, charIndex + 1);
      charIndex++;

      if (charIndex === currentText.length) {
        // 타이핑 완료, 잠시 대기 후 삭제 시작
        isDeleting = true;
        typingSpeed = 2000; // 2초 대기
      } else {
        typingSpeed = 100;
      }
    } else {
      // 삭제 중
      typedTextElement.textContent = currentText.substring(0, charIndex - 1);
      charIndex--;

      if (charIndex === 0) {
        // 삭제 완료, 다음 텍스트로
        isDeleting = false;
        textIndex = (textIndex + 1) % texts.length;
        typingSpeed = 500; // 0.5초 대기
      } else {
        typingSpeed = 50;
      }
    }

    setTimeout(typeText, typingSpeed);
  }

  // 타이핑 시작
  setTimeout(() => {
    typeText();
  }, 1000);

  // Flutter 로딩 완료 시 로딩 화면 제거
  window.addEventListener('flutter-first-frame', function() {
    const loadingContainer = document.getElementById('loading-container');
    loadingContainer.classList.add('fade-out');

    setTimeout(() => {
      loadingContainer.style.display = 'none';
    }, 500);
  });
</script>

<script>
  // The value below is injected by flutter build, do not touch.
  const serviceWorkerVersion = "1465573972" /* Flutter's service worker is deprecated and will be removed in a future Flutter release. */;
</script>
<!-- This script adds the flutter initialization JS code -->
<script src="flutter.js" defer></script>
<script>
  window.addEventListener('load', function(ev) {
    // Download main.dart.js
    _flutter.loader.loadEntrypoint({
      serviceWorker: {
        serviceWorkerVersion: serviceWorkerVersion,
      },
      onEntrypointLoaded: function(engineInitializer) {
        engineInitializer.initializeEngine().then(function(appRunner) {
          appRunner.runApp();
        });
      }
    });
  });
</script>
</body>
</html>
