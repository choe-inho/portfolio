<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="최인호의 개발 포트폴리오">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Portfolio">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Portfolio - 최인호</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* 🎨 전역 스타일 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      overflow: hidden;
    }

    /* 🌊 로딩 컨테이너 */
    #loading-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      background: #ffffff;
      transition: opacity 0.5s ease-out;
    }

    #loading-container.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* 🌊 곡선 배경 컨테이너 */
    .wave-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }

    /* 🌊 넘실거리는 곡선들 */
    .wave-layer {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 60%;
      background: linear-gradient(to bottom,
        rgba(16, 185, 129, 0.3) 0%,
        rgba(16, 185, 129, 0.15) 30%,
        rgba(16, 185, 129, 0.05) 60%,
        rgba(16, 185, 129, 0) 100%
      );
      clip-path: url(#wave1);
      animation: wave-flow-1 8s ease-in-out infinite;
    }

    .wave-layer-2 {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 55%;
      background: linear-gradient(to bottom,
        rgba(59, 130, 246, 0.25) 0%,
        rgba(59, 130, 246, 0.12) 30%,
        rgba(59, 130, 246, 0.04) 60%,
        rgba(59, 130, 246, 0) 100%
      );
      clip-path: url(#wave2);
      animation: wave-flow-2 10s ease-in-out infinite;
      animation-delay: -2s;
    }

    .wave-layer-3 {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 50%;
      background: linear-gradient(to bottom,
        rgba(168, 85, 247, 0.2) 0%,
        rgba(168, 85, 247, 0.1) 30%,
        rgba(168, 85, 247, 0.03) 60%,
        rgba(168, 85, 247, 0) 100%
      );
      clip-path: url(#wave3);
      animation: wave-flow-3 12s ease-in-out infinite;
      animation-delay: -4s;
    }

    /* 🌊 넘실거림 애니메이션 */
    @keyframes wave-flow-1 {
      0%, 100% {
        transform: translateY(0px) scaleY(1);
      }
      50% {
        transform: translateY(-20px) scaleY(1.1);
      }
    }

    @keyframes wave-flow-2 {
      0%, 100% {
        transform: translateY(0px) scaleY(1);
      }
      50% {
        transform: translateY(-30px) scaleY(1.15);
      }
    }

    @keyframes wave-flow-3 {
      0%, 100% {
        transform: translateY(0px) scaleY(1);
      }
      50% {
        transform: translateY(-25px) scaleY(1.12);
      }
    }

    /* 💬 타이핑 텍스트 컨테이너 */
    .typing-container {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 0 20px;
    }

    .greeting {
      font-size: 1.5rem;
      font-weight: 600;
      color: #10B981;
      margin-bottom: 1rem;
      opacity: 0;
      animation: fade-in 0.5s ease-out 0.3s forwards;
    }

    .typing-text {
      font-size: 2.5rem;
      font-weight: 700;
      color: #1f2937;
      min-height: 3rem;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      animation: fade-in 0.5s ease-out 0.6s forwards;
    }

    .cursor {
      display: inline-block;
      width: 3px;
      height: 2.5rem;
      background-color: #10B981;
      margin-left: 5px;
      animation: blink 1s infinite;
    }

    @keyframes fade-in {
      to {
        opacity: 1;
      }
    }

    @keyframes blink {
      0%, 49% {
        opacity: 1;
      }
      50%, 100% {
        opacity: 0;
      }
    }

    /* 🎯 로딩 인디케이터 */
    .loading-dots {
      position: relative;
      z-index: 2;
      display: flex;
      gap: 8px;
      margin-top: 2rem;
      opacity: 0;
      animation: fade-in 0.5s ease-out 0.9s forwards;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #10B981;
      animation: bounce 1.4s infinite ease-in-out;
    }

    .dot:nth-child(1) {
      animation-delay: -0.32s;
    }

    .dot:nth-child(2) {
      animation-delay: -0.16s;
    }

    @keyframes bounce {
      0%, 80%, 100% {
        transform: scale(0.8);
        opacity: 0.5;
      }
      40% {
        transform: scale(1.2);
        opacity: 1;
      }
    }

    /* 📱 반응형 */
    @media (max-width: 768px) {
      .greeting {
        font-size: 1.2rem;
      }

      .typing-text {
        font-size: 1.8rem;
      }

      .cursor {
        height: 1.8rem;
      }

      .wave-layer {
        height: 50%;
      }

      .wave-layer-2 {
        height: 45%;
      }

      .wave-layer-3 {
        height: 40%;
      }
    }

    @media (max-width: 480px) {
      .greeting {
        font-size: 1rem;
      }

      .typing-text {
        font-size: 1.5rem;
      }

      .cursor {
        height: 1.5rem;
      }

      .wave-layer {
        height: 45%;
      }

      .wave-layer-2 {
        height: 40%;
      }

      .wave-layer-3 {
        height: 35%;
      }
    }

    /* 🌙 다크모드 지원 */
    @media (prefers-color-scheme: dark) {
      #loading-container {
        background: #1f2937;
      }

      .wave-layer {
        background: linear-gradient(to bottom,
          rgba(16, 185, 129, 0.4) 0%,
          rgba(16, 185, 129, 0.2) 30%,
          rgba(16, 185, 129, 0.08) 60%,
          rgba(16, 185, 129, 0) 100%
        );
      }

      .wave-layer-2 {
        background: linear-gradient(to bottom,
          rgba(59, 130, 246, 0.35) 0%,
          rgba(59, 130, 246, 0.18) 30%,
          rgba(59, 130, 246, 0.06) 60%,
          rgba(59, 130, 246, 0) 100%
        );
      }

      .wave-layer-3 {
        background: linear-gradient(to bottom,
          rgba(168, 85, 247, 0.3) 0%,
          rgba(168, 85, 247, 0.15) 30%,
          rgba(168, 85, 247, 0.05) 60%,
          rgba(168, 85, 247, 0) 100%
        );
      }

      .typing-text {
        color: #f3f4f6;
      }
    }
  </style>
</head>
<body>
<!-- 🌊 로딩 화면 -->
<div id="loading-container">
  <!-- SVG 곡선 정의 -->
  <svg style="position: absolute; width: 0; height: 0;">
    <defs>
      <!-- 첫 번째 곡선 -->
      <clipPath id="wave1" clipPathUnits="objectBoundingBox">
        <path d="M 0,0.3
                   C 0.2,0.1 0.4,0.4 0.6,0.3
                   C 0.8,0.2 1,0.4 1,0.3
                   L 1,1 L 0,1 Z">
          <animate attributeName="d"
                   dur="8s"
                   repeatCount="indefinite"
                   values="M 0,0.3 C 0.2,0.1 0.4,0.4 0.6,0.3 C 0.8,0.2 1,0.4 1,0.3 L 1,1 L 0,1 Z;
                             M 0,0.4 C 0.2,0.3 0.4,0.2 0.6,0.4 C 0.8,0.5 1,0.3 1,0.4 L 1,1 L 0,1 Z;
                             M 0,0.3 C 0.2,0.1 0.4,0.4 0.6,0.3 C 0.8,0.2 1,0.4 1,0.3 L 1,1 L 0,1 Z"/>
        </path>
      </clipPath>

      <!-- 두 번째 곡선 -->
      <clipPath id="wave2" clipPathUnits="objectBoundingBox">
        <path d="M 0,0.35
                   C 0.3,0.25 0.5,0.5 0.7,0.35
                   C 0.85,0.25 1,0.45 1,0.35
                   L 1,1 L 0,1 Z">
          <animate attributeName="d"
                   dur="10s"
                   repeatCount="indefinite"
                   values="M 0,0.35 C 0.3,0.25 0.5,0.5 0.7,0.35 C 0.85,0.25 1,0.45 1,0.35 L 1,1 L 0,1 Z;
                             M 0,0.45 C 0.3,0.35 0.5,0.3 0.7,0.45 C 0.85,0.5 1,0.35 1,0.45 L 1,1 L 0,1 Z;
                             M 0,0.35 C 0.3,0.25 0.5,0.5 0.7,0.35 C 0.85,0.25 1,0.45 1,0.35 L 1,1 L 0,1 Z"/>
        </path>
      </clipPath>

      <!-- 세 번째 곡선 -->
      <clipPath id="wave3" clipPathUnits="objectBoundingBox">
        <path d="M 0,0.4
                   C 0.25,0.5 0.55,0.3 0.75,0.4
                   C 0.9,0.5 1,0.3 1,0.4
                   L 1,1 L 0,1 Z">
          <animate attributeName="d"
                   dur="12s"
                   repeatCount="indefinite"
                   values="M 0,0.4 C 0.25,0.5 0.55,0.3 0.75,0.4 C 0.9,0.5 1,0.3 1,0.4 L 1,1 L 0,1 Z;
                             M 0,0.35 C 0.25,0.25 0.55,0.45 0.75,0.35 C 0.9,0.25 1,0.45 1,0.35 L 1,1 L 0,1 Z;
                             M 0,0.4 C 0.25,0.5 0.55,0.3 0.75,0.4 C 0.9,0.5 1,0.3 1,0.4 L 1,1 L 0,1 Z"/>
        </path>
      </clipPath>
    </defs>
  </svg>

  <!-- 곡선 배경 레이어 -->
  <div class="wave-background">
    <div class="wave-layer"></div>
    <div class="wave-layer-2"></div>
    <div class="wave-layer-3"></div>
  </div>

  <!-- 타이핑 텍스트 -->
  <div class="typing-container">
    <div class="greeting">PORTFOLIO</div>
    <div class="typing-text">
      <span id="typed-text"></span>
      <span class="cursor"></span>
    </div>
  </div>

  <!-- 로딩 인디케이터 -->
  <div class="loading-dots">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>

<!-- 📜 타이핑 스크립트 -->
<script>
  // 타이핑 효과 텍스트
  const texts = [
    "안녕하세요",
    "개발자 최인호입니다",
    "포트폴리오를 준비중입니다..."
  ];

  let textIndex = 0;
  let charIndex = 0;
  let isDeleting = false;
  let typingSpeed = 100;

  function typeText() {
    const currentText = texts[textIndex];
    const typedTextElement = document.getElementById('typed-text');

    if (!isDeleting) {
      // 타이핑 중
      typedTextElement.textContent = currentText.substring(0, charIndex + 1);
      charIndex++;

      if (charIndex === currentText.length) {
        // 타이핑 완료, 잠시 대기 후 삭제 시작
        isDeleting = true;
        typingSpeed = 2000; // 2초 대기
      } else {
        typingSpeed = 100;
      }
    } else {
      // 삭제 중
      typedTextElement.textContent = currentText.substring(0, charIndex - 1);
      charIndex--;

      if (charIndex === 0) {
        // 삭제 완료, 다음 텍스트로
        isDeleting = false;
        textIndex = (textIndex + 1) % texts.length;
        typingSpeed = 500; // 0.5초 대기
      } else {
        typingSpeed = 50;
      }
    }

    setTimeout(typeText, typingSpeed);
  }

  // 타이핑 시작
  setTimeout(() => {
    typeText();
  }, 1000);

  // Flutter 로딩 완료 시 로딩 화면 제거
  window.addEventListener('flutter-first-frame', function() {
    const loadingContainer = document.getElementById('loading-container');
    loadingContainer.classList.add('fade-out');

    setTimeout(() => {
      loadingContainer.style.display = 'none';
    }, 500);
  });
</script>

<script>
  // The value below is injected by flutter build, do not touch.
  const serviceWorkerVersion = null;
</script>
<!-- This script adds the flutter initialization JS code -->
<script src="flutter.js" defer></script>
<script>
  window.addEventListener('load', function(ev) {
    // Download main.dart.js
    _flutter.loader.loadEntrypoint({
      serviceWorker: {
        serviceWorkerVersion: serviceWorkerVersion,
      },
      onEntrypointLoaded: function(engineInitializer) {
        engineInitializer.initializeEngine().then(function(appRunner) {
          appRunner.runApp();
        });
      }
    });
  });
</script>
</body>
</html>
